name: One-time SDK 58 lockfile regeneration

on:
  push:
    branches:
      - ci/regenerate-sdk58-lockfile-once

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: RoastMyWallet/package-lock.json

      - name: Regenerate lockfile from SDK 58 package manifest
        working-directory: RoastMyWallet
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify the generated lockfile with a clean install
        working-directory: RoastMyWallet
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RoastMyWallet/package-lock.json
          git rm .github/workflows/regenerate-sdk58-lockfile.yml
          git commit -m "chore: regenerate SDK 58 package lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
