name: One-time SDK 58 final validation

on:
  push:
    branches:
      - fix/sdk58-doctor-config

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: RoastMyWallet/package-lock.json

      - name: Regenerate SDK 58 lockfile
        working-directory: RoastMyWallet
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        working-directory: RoastMyWallet
        run: npm ci --no-audit --no-fund

      - name: Run Expo Doctor
        id: doctor
        continue-on-error: true
        working-directory: RoastMyWallet
        run: npx expo-doctor

      - name: Run TypeScript check
        id: typecheck
        continue-on-error: true
        working-directory: RoastMyWallet
        run: npm run typecheck

      - name: Save lockfile and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RoastMyWallet/package-lock.json
          git rm .github/workflows/validate-sdk58-final.yml
          git commit -m "chore: sync SDK 58 lockfile after config fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
