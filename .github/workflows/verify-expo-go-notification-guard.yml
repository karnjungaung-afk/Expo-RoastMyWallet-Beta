name: Verify Expo Go notification guard

on:
  push:
    branches:
      - fix/expo-go-notifications-detection

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: RoastMyWallet/package-lock.json

      - name: Clean install
        working-directory: RoastMyWallet
        run: npm ci --no-audit --no-fund

      - name: Expo Doctor
        working-directory: RoastMyWallet
        run: npx expo-doctor

      - name: TypeScript check
        working-directory: RoastMyWallet
        run: npm run typecheck

      - name: Verify Android bundle
        working-directory: RoastMyWallet
        run: npx expo export --platform android

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-expo-go-notification-guard.yml
          git commit -m "chore: remove temporary notification validation workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
